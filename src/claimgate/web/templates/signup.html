<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a ClaimGate account.">
  <title>Create account — ClaimGate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/auth.js" defer></script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <a href="/" class="brand-lockup auth-brand">
      <img src="/static/brand/claimgate-logo.png" alt="ClaimGate" class="brand-logo-wordmark">
    </a>

    <div class="auth-card">
      <p class="eyebrow">Get started</p>
      <h1>Create your workspace</h1>
      <p class="auth-card-copy">Set up ClaimGate for your authorization workflows.</p>

      <div id="auth-error" class="auth-error" hidden role="alert"></div>

      <form id="signup-form" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Full name</span>
          <input type="text" name="full_name" id="signup-full-name" autocomplete="name" required>
        </label>
        <label class="auth-field">
          <span>Work email</span>
          <input type="email" name="email" id="signup-email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>Workspace name</span>
          <input type="text" name="workspace_name" id="signup-workspace" autocomplete="organization" required>
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input type="password" name="password" id="signup-password" autocomplete="new-password" minlength="6" required>
        </label>
        <label class="auth-field">
          <span>Confirm password</span>
          <input type="password" name="confirm_password" id="signup-confirm-password" autocomplete="new-password" minlength="6" required>
        </label>
        <p class="auth-field-hint">At least 6 characters.</p>
        <button type="submit" class="primary-button auth-submit" id="signup-submit">
          <span>Create account</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
</body>
</html>
