<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recover access to your ClaimGate account.">
  <title>Reset password — ClaimGate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/auth.js" defer></script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <a href="/" class="brand-lockup auth-brand">
      <img src="/static/brand/claimgate-logo.png" alt="ClaimGate" class="brand-logo-wordmark">
    </a>

    <div class="auth-card">
      <p class="eyebrow">Password recovery</p>
      <h1>Reset your password</h1>
      <p class="auth-card-copy">
        This build does not send real email. Password recovery is a local/dev UI only —
        submitting shows what a production flow would confirm, without dispatching anything.
      </p>

      <div id="auth-error" class="auth-error" hidden role="alert"></div>
      <div id="auth-notice" class="auth-notice" hidden></div>

      <form id="forgot-password-form" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" id="forgot-email" autocomplete="email" required>
        </label>
        <button type="submit" class="primary-button auth-submit" id="forgot-submit">
          <span>Send recovery link</span><span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-switch"><a href="/login">← Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
