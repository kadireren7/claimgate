[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claimgate"
version = "0.1.0"
description = "Authorization infrastructure for AI agents performing irreversible actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.0,<1",
    "jinja2>=3.1.0,<4",
    "mcp>=1.15.0,<2",
    "pydantic>=2.10.0,<3",
    "python-dotenv>=1.0.0,<2",
    "pyyaml>=6.0.0,<7",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8.0,<1",
]

[project.scripts]
claimgate-generate-pdf = "claimgate.cli.generate_pdf:main"
claimgate-test-esign = "claimgate.cli.test_esign:main"
claimgate-demo-phase2 = "claimgate.cli.demo_phase2:main"
claimgate-demo-phase3 = "claimgate.cli.demo_phase3:main"
claimgate-demo-web = "claimgate.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claimgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicit CLAIMGATE_RUN_LIVE_FOXIT=1 and live Foxit credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
